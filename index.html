<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24col - Trámites sin Enredos</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            flex: 1; /* Empuja el footer hacia abajo si sobra espacio */
        }

        /* Contenedor del texto con efecto de escritura y la imagen */
        .logo-container {
            margin: 20px auto 10px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
        }

        /* Efecto de máquina de escribir para el texto inicial */
        .typewriter-text {
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 42px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #000000;
            width: 0;
            animation: typing 1.2s steps(5, end) forwards, blink 0.75s step-end infinite;
            margin-bottom: 10px;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 145px; } /* Ajustado al ancho exacto de "24col" */
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #000000; }
        }

        /* Oculta la imagen inicialmente y la muestra al terminar la escritura */
        .logo-img {
            width: 280px;
            height: auto;
            opacity: 0;
            animation: fadeInImage 0.5s ease forwards;
            animation-delay: 1.3s; /* Comienza justo después de terminar de escribir */
        }

        @keyframes fadeInImage {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Lista de Categorías estilo texto plano / enlaces clásicos */
        .categories-list {
            text-align: center;
            margin: 30px 0;
            font-size: 16px;
            line-height: 1.8;
        }

        .categories-list a {
            color: #0000ee;
            font-weight: bold;
            text-decoration: underline;
        }

        .categories-list span {
            color: #333333;
        }

        /* Barra de Búsqueda clásica sin colores */
        .search-container {
            margin: 25px 0;
            font-size: 15px;
        }

        .search-container form {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .search-container input[type="text"] {
            padding: 4px 8px;
            font-size: 14px;
            width: 220px;
            border: 1px solid #7f7f7f;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-container input[type="text"]:focus {
            border-color: #000000;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.2);
        }

        .search-container input[type="submit"] {
            padding: 4px 10px;
            font-size: 14px;
            cursor: pointer;
        }

        footer {
            margin-top: auto; /* Se fija dinámicamente al fondo */
            padding-top: 20px;
            font-size: 12px;
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Texto con efecto de escritura seguido de la imagen -->
        <div class="logo-container">
            <div class="typewriter-text">24col</div>
            <img src="condor01.png" alt="24col" class="logo-img">
        </div>

        <!-- Categorías listadas estilo texto plano -->
        <div class="categories-list">
            <div><a href="#">Todos los portales</a> - accesos directos y estado</div>
            <div><a href="#identity">Identidad y Citas</a> - cédula, pasaporte, registraduría</div>
            <div><a href="#taxes">Impuestos y Facturas</a> - DIAN, RUT, impuestos</div>
            <div><a href="#home">Servicios del Hogar</a> - agua, luz, gas, alcaldías</div>
        </div>

        <!-- Barra de búsqueda en español -->
        <div class="search-container">
            <form action="#" method="get">
                <label for="searchInput"><strong>buscar -</strong> </label>
                <input type="text" id="searchInput" name="q" placeholder="">
                <input type="submit" value="Ir">
            </form>
        </div>

    </div>

    <!-- Pie de página sticky -->
    <footer>
        2026 24col · por: jahp
    </footer>

</body>
</html>
