<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24col - Trámites por Ciudad</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            flex: 1;
        }

        /* Encabezado compacto */
        .header-nav {
            margin: 10px 0 20px 0;
            font-size: 14px;
        }

        .header-nav a {
            color: #0000ee;
            font-weight: bold;
            text-decoration: underline;
        }

        .city-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: capitalize;
        }

        .category-subtitle {
            font-size: 15px;
            color: #555555;
            margin-bottom: 20px;
        }

        /* Espacio para la imagen de la ciudad y sus créditos */
        .city-banner-wrapper {
            margin: 0 0 20px 0;
        }

        .city-banner-container {
            width: 100%;
            max-height: 200px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .city-banner-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .image-credit {
            font-size: 11px;
            color: #777777;
            text-align: right;
            margin-top: 4px;
            font-style: italic;
        }

        .image-credit a {
            color: #555555;
            text-decoration: underline;
        }

        /* Lista de portales y trámites */
        .links-list {
            text-align: left;
            margin: 20px 0;
            font-size: 15px;
            line-height: 2;
        }

        .links-list ul {
            list-style-type: square;
            padding-left: 20px;
        }

        .links-list a {
            color: #0000ee;
            font-weight: bold;
            text-decoration: underline;
        }

        .link-desc {
            color: #333333;
            font-weight: normal;
        }

        footer {
            margin-top: auto;
            padding-top: 20px;
            font-size: 12px;
            color: #555555;
        }
    </style>
</head>

        </figure>

        <div class="links-list">

    </div>

                    { name: 'Secretaría de Movilidad Villavicencio', url: 'https://villavicencio.gov.co/movilidad', desc: 'servicios de tránsito y pico y placa' }
                ]
            },
            'valledupar': {
                'impuestos': [
                    { name: 'Alcaldía de Valledupar - Impuestos', url: 'https://valledupar.gov.co', desc: 'pago de predial e ICA' },
                    { name: 'Gobernación del Cesar', url: 'https://www.cesar.gov.co', desc: 'impuesto sobre vehículos automotores' }
                ],
                'hogar': [
                    { name: 'Alcaldía de Valledupar', url: 'https://valledupar.gov.co', desc: 'portal único de atención' },
                    { name: 'EMDUPAR', url: 'https://www.emdupar.gov.co', desc: 'pago de factura de acueducto y alcantarillado' },
                    { name: 'Afinia (Grupo EPM)', url: 'https://www.afinia.com.co', desc: 'pago de factura de energía eléctrica' },
                    { name: 'Gases del Caribe', url: 'https://www.gascaribe.com', desc: 'pago de factura de gas natural' }
                ],
                'movilidad': [
                    { name: 'Tránsito Valledupar', url: 'https://valledupar.gov.co/transito', desc: 'trámites, comparendos y movilidad' }
                ]
            }
        };

        // Asignación de textos y títulos
        const readableCityName = cityNames[cityParam] || cityParam;
        document.getElementById('cityName').textContent = readableCityName;
        document.getElementById('categoryName').textContent = catNames[catParam] || 'Trámites locales';

        // Configuración de la imagen de la ciudad
        const imgElement = document.getElementById('cityBanner');
        const creditElement = document.getElementById('imageCredit');
        const imgPath = cityImages[cityParam] || `img/${cityParam}.jpg`;
        
        imgElement.src = imgPath;
        imgElement.alt = `Fotografía de ${readableCityName}`;
        
        // Asignar crédito dinámico
        creditElement.innerHTML = cityCredits[cityParam] || 'Foto: Archivo público / Fuente municipal';

        // Si la imagen falla al cargar, oculta el bloque completo
        imgElement.onerror = function() {
            document.getElementById('cityBannerWrapper').style.display = 'none';
        };

        // Renderizado del listado de enlaces
        const container = document.getElementById('linksContainer');
        const cityObj = linksData[cityParam] || linksData['bogota'];
        const list = cityObj[catParam] || cityObj['impuestos'] || [];

        if (list.length === 0) {
            container.innerHTML = '<li><span class="link-desc">No se encontraron enlaces para esta categoría en la ciudad seleccionada.</span></li>';
        } else {
            list.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="${item.url}" target="_blank" rel="noopener">${item.name}</a> <span class="link-desc">- ${item.desc}</span>`;
                container.appendChild(li);
            });
        }
    </script>

</body>
</html>
