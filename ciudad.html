<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24col - Trámites por Ciudad</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            flex: 1;
        }

        /* Encabezado compacto */
        .header-nav {
            margin: 10px 0 20px 0;
            font-size: 14px;
        }

        .header-nav a {
            color: #0000ee;
            font-weight: bold;
            text-decoration: underline;
        }

        .city-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: capitalize;
        }

        .category-subtitle {
            font-size: 15px;
            color: #555555;
            margin-bottom: 20px;
        }

        /* Espacio para la imagen de la ciudad y sus créditos */
        .city-banner-wrapper {
            margin: 0 0 20px 0;
        }

        .city-banner-container {
            width: 100%;
            max-height: 200px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .city-banner-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .image-credit {
            font-size: 11px;
            color: #777777;
            text-align: right;
            margin-top: 4px;
            font-style: italic;
        }

        .image-credit a {
            color: #555555;
            text-decoration: underline;
        }

        /* Lista de portales y trámites */
        .links-list {
            text-align: left;
            margin: 20px 0;
            font-size: 15px;
            line-height: 2;
        }

        .links-list ul {
            list-style-type: square;
            padding-left: 20px;
        }

        .links-list a {
            color: #0000ee;
            font-weight: bold;
            text-decoration: underline;
        }

        .link-desc {
            color: #333333;
            font-weight: normal;
        }

        /* Barra de búsqueda interna */
        .search-container {
            margin: 30px 0 15px 0;
            font-size: 15px;
        }

        .search-container form {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .search-container input[type="text"] {
            padding: 4px 8px;
            font-size: 14px;
            width: 220px;
            border: 1px solid #7f7f7f;
            outline: none;
        }

        .search-container input[type="submit"] {
            padding: 4px 10px;
            font-size: 14px;
            cursor: pointer;
        }

        footer {
            margin-top: auto;
            padding-top: 20px;
            font-size: 12px;
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Navegación superior estilo retro -->
        <div class="header-nav">
            <a href="index.html">&laquo; Volver a 24col</a>
        </div>

        <!-- Título dinámico de la ciudad y categoría -->
        <div class="city-title" id="cityName">Ciudad</div>
        <div class="category-subtitle" id="categoryName">Categoría seleccionada</div>

        <!-- Espacio reservado para la imagen representativa de la ciudad y su crédito -->
        <figure class="city-banner-wrapper" id="cityBannerWrapper">
            <div class="city-banner-container">
                <img id="cityBanner" src="" alt="Imagen de la ciudad" class="city-banner-img">
            </div>
            <figcaption class="image-credit" id="imageCredit">Foto: Crédito de la imagen</figcaption>
        </figure>

        <div class="links-list">
            <ul id="linksContainer">
                <!-- Se cargan dinámicamente con JS según los parámetros -->
            </ul>
        </div>

        <!-- Búsqueda específica -->
        <div class="search-container">
            <form action="#" method="get">
                <label for="searchInput"><strong>buscar en esta ciudad -</strong> </label>
                <input type="text" id="searchInput" name="q" placeholder="">
                <input type="submit" value="Ir">
            </form>
        </div>

    </div>

    <!-- Pie de página sticky -->
    <footer>
        &copy; 2026 Cóndor.co - Iniciativa independiente para el pueblo colombiano · Por: jahp
    </footer>

    <script>
        // Lectura de parámetros URL (?cat=...&city=...)
        const urlParams = new URLSearchParams(window.location.search);
        const cityParam = urlParams.get('city') || 'monteria';
        const catParam = urlParams.get('cat') || 'impuestos';

        // Mapeo de nombres legibles para la cabecera
        const cityNames = {
            'bogota': 'Bogotá D.C.',
            'medellin': 'Medellín / Antioquia',
            'cali': 'Cali / Valle del Cauca',
            'barranquilla': 'Barranquilla / Atlántico',
            'monteria': 'Montería / Córdoba'
        };

        // Mapeo de imágenes por ciudad
        const cityImages = {
            'bogota': 'img/BOGOTA.jpeg',
            'medellin': 'img/MEDELLIN.jpeg',
            'cali': 'img/CALIVALLE.jpeg',
            'barranquilla': 'img/BARRANQUILLA.jpeg',
            'monteria': 'img/MONTERIA.jpeg'
        };

        // Créditos de las imágenes por ciudad (Puedes ingresar texto o HTML ligero como enlaces)
        const cityCredits = {
            'bogota': 'Foto: <a href="https://commons.wikimedia.org/wiki/File:BOGOTA_CITY.jpg">KEVIN CASTAÑEDA VILLAMIL</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>, via Wikimedia Commons',
            'medellin': '<a href="https://commons.wikimedia.org/wiki/File:Medell%C3%ADn-1.jpg">Michu2709</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>, via Wikimedia Commons',
            'cali': '<a href="https://commons.wikimedia.org/wiki/File:Panor%C3%A1mica_-_Cali_-_Valle_del_Cauca_-_Colombia.jpg">Neoredacturus</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>, via Wikimedia Commons',
            'barranquilla': '<a href="https://commons.wikimedia.org/wiki/File:Barranquilla_panoramica.jpg">Hsolp</a>, CC0, via Wikimedia Commons',
            'monteria': '<a href="https://commons.wikimedia.org/wiki/File:Ronda_del_Sin%C3%BA.jpg">Vgallego66</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>, via Wikimedia Commons'
        };

        const catNames = {
            'impuestos': 'Impuestos Regionales, Predial y Vehículos',
            'hogar': 'Servicios Públicos y Portal del Municipio',
            'movilidad': 'Movilidad, Tránsito Local y Comparendos'
        };

        // Base de datos de portales organizada por [ciudad][categoría]
        const linksData = {
            'monteria': {
                'impuestos': [
                    { name: 'Alcaldía de Montería - Impuesto Predial', url: 'https://www.monteria.gov.co', desc: 'descarga y pago de factura predial unificada' },
                    { name: 'Gobernación de Córdoba - Impuesto Vehicular', url: 'https://www.cordoba.gov.co', desc: 'liquidación y pago de impuesto de vehículos' }
                ],
                'hogar': [
                    { name: 'Alcaldía de Montería (Portal Oficial)', url: 'https://www.monteria.gov.co', desc: 'trámites, ventanilla única y boletines' },
                    { name: 'Veolia Montería', url: 'https://www.veolia.com.co/monteria', desc: 'pago de factura de acueducto y alcantarillado' },
                    { name: 'Afinia (Grupo EPM)', url: 'https://www.afinia.com.co', desc: 'pago de factura de energía eléctrica' },
                    { name: 'Surtigas', url: 'https://www.surtigas.com.co', desc: 'pago y gestión de servicio de gas natural' }
                ],
                'movilidad': [
                    { name: 'Secretaría de Tránsito de Montería', url: 'https://www.monteria.gov.co/transito', desc: 'consulta de pico y placa, trámites y acuerdos de pago' }
                ]
            },
            'bogota': {
                'impuestos': [
                    { name: 'Secretaría de Hacienda (DIB)', url: 'https://www.haciendabogota.gov.co', desc: 'pago de impuesto predial y vehículos Bogotá' }
                ],
                'hogar': [
                    { name: 'Alcaldía Mayor de Bogotá', url: 'https://bogota.gov.co', desc: 'portal único de trámites distritales' },
                    { name: 'EAAB - Acueducto de Bogotá', url: 'https://www.acueducto.com.co', desc: 'duplicado y pago de factura de agua' },
                    { name: 'Vanti (Gas Natural)', url: 'https://www.grupovanti.com', desc: 'pago de servicio de gas domiciliario' }
                ],
                'movilidad': [
                    { name: 'Secretaría de Movilidad de Bogotá', url: 'https://www.movilidadbogota.gov.co', desc: 'pico y placa, agendamiento y comparendos' }
                ]
            },
            'medellin': {
                'impuestos': [
                    { name: 'Hacienda Medellín', url: 'https://www.medellin.gov.co/hacienda', desc: 'impuesto predial e industria y comercio' },
                    { name: 'Gobernación de Antioquia', url: 'https://www.antioquia.gov.co', desc: 'impuesto vehicular de Antioquia' }
                ],
                'hogar': [
                    { name: 'Alcaldía de Medellín', url: 'https://www.medellin.gov.co', desc: 'portal oficial del municipio' },
                    { name: 'EPM - Empresas Públicas de Medellín', url: 'https://www.epm.com.co', desc: 'pago unificado de agua, luz y gas' }
                ],
                'movilidad': [
                    { name: 'Secretaría de Movilidad de Medellín', url: 'https://www.medellin.gov.co/movilidad', desc: 'pico y placa y trámites de tránsito' }
                ]
            },
            'cali': {
                'impuestos': [
                    { name: 'Hacienda Municipal de Cali', url: 'https://www.cali.gov.co/hacienda', desc: 'impuesto predial e ICA' },
                    { name: 'Gobernación del Valle del Cauca', url: 'https://www.valledelcauca.gov.co', desc: 'impuesto automotor del departamento' }
                ],
                'hogar': [
                    { name: 'Alcaldía de Santiago de Cali', url: 'https://www.cali.gov.co', desc: 'ventanilla única de atención' },
                    { name: 'EMCALI', url: 'https://www.emcali.com.co', desc: 'pago de energía, acueducto y alcantarillado' }
                ],
                'movilidad': [
                    { name: 'Secretaría de Movilidad de Cali', url: 'https://www.cali.gov.co/movilidad', desc: 'servicios de tránsito y pico y placa' }
                ]
            },
            'barranquilla': {
                'impuestos': [
                    { name: 'Gerencia de Ingresos - Barranquilla', url: 'https://www.barranquilla.gov.co/hacienda', desc: 'impuesto predial distrital' },
                    { name: 'Gobernación del Atlántico', url: 'https://www.atlantico.gov.co', desc: 'impuesto sobre vehículos automotores' }
                ],
                'hogar': [
                    { name: 'Alcaldía de Barranquilla', url: 'https://www.barranquilla.gov.co', desc: 'portales de atención distrital' },
                    { name: 'Triple A', url: 'https://www.aaa.com.co', desc: 'pago de factura de acueducto, alcantarillado y aseo' },
                    { name: 'Gases del Caribe', url: 'https://www.gascaribe.com', desc: 'pago y duplicado de factura de gas' }
                ],
                'movilidad': [
                    { name: 'Secretaría de Tránsito de Barranquilla', url: 'https://www.barranquilla.gov.co/transito', desc: 'trámites y consultas de movilidad' }
                ]
            }
        };

        // Asignación de textos y títulos
        document.getElementById('cityName').textContent = cityNames[cityParam] || cityParam;
        document.getElementById('categoryName').textContent = catNames[catParam] || 'Trámites locales';

        // Configuración de la imagen de la ciudad
        const imgElement = document.getElementById('cityBanner');
        const creditElement = document.getElementById('imageCredit');
        const imgPath = cityImages[cityParam] || `img/${cityParam}.jpg`;
        
        imgElement.src = imgPath;
        imgElement.alt = `Fotografía de ${cityNames[cityParam] || cityParam}`;
        
        // Asignar el texto de crédito
        creditElement.innerHTML = cityCredits[cityParam] || 'Foto: Crédito de la imagen';

        // Si la imagen no carga/no existe, oculta todo el contenedor junto con el crédito
        imgElement.onerror = function() {
            document.getElementById('cityBannerWrapper').style.display = 'none';
        };

        // Renderizado del listado de enlaces
        const container = document.getElementById('linksContainer');
        const cityObj = linksData[cityParam] || linksData['monteria'];
        const list = cityObj[catParam] || cityObj['impuestos'] || [];

        if (list.length === 0) {
            container.innerHTML = '<li><span class="link-desc">No se encontraron enlaces para esta categoría en la ciudad seleccionada.</span></li>';
        } else {
            list.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="${item.url}" target="_blank" rel="noopener">${item.name}</a> <span class="link-desc">- ${item.desc}</span>`;
                container.appendChild(li);
            });
        }
    </script>

</body>
</html>
