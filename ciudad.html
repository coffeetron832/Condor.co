<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24col - Trámites por Ciudad</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f8fafc;
            --header-bg: rgba(255, 255, 255, 0.95);
            --text-color: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --link-color: #2563eb;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --shadow-color: rgba(15, 23, 42, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --header-bg: rgba(18, 18, 18, 0.95);
            --text-color: #f4f4f5;
            --text-secondary: #a1a1aa;
            --border-color: #27272a;
            --link-color: #60a5fa;
            --card-bg: #1e1e20;
            --card-border: #27272a;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        html, body { height: 100%; margin: 0; padding: 0; }
        body { font-family: Arial, Helvetica, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; transition: background-color 0.2s ease, color 0.2s ease; }

        .container { max-width: 680px; margin: 0 auto; flex: 1; width: 100%; padding: 20px; }
        
        .header-nav { margin: 10px 0 20px 0; font-size: 14px; }
        .header-nav a { color: var(--link-color); font-weight: 600; text-decoration: underline; }

        .city-title { font-family: 'Archivo Black', sans-serif; font-size: 32px; margin-bottom: 5px; text-transform: capitalize; color: var(--text-color); }
        .category-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 20px; }

        .city-banner-container { width: 100%; max-width: 480px; margin: 0 auto 4px auto; background-color: var(--card-bg); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .city-banner-img { width: 100%; height: auto; max-height: 240px; display: block; }
        .image-credit { font-size: 11px; color: var(--text-secondary); text-align: right; margin-bottom: 20px; font-style: italic; }
        .image-credit a { color: var(--text-secondary); text-decoration: underline; }

        .links-list { text-align: left; margin: 20px 0; font-size: 15px; line-height: 1.8; }
        .links-list ul { list-style-type: none; padding-left: 0; }
        .links-list li { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--border-color); }
        .links-list a { color: var(--link-color); font-weight: 600; text-decoration: underline; }
        .link-desc { display: block; color: var(--text-secondary); font-size: 13px; margin-top: 2px; }

        footer { margin-top: auto; padding: 30px 20px; font-size: 12px; color: var(--text-secondary); text-align: center; border-top: 1px solid var(--border-color); }

        /* ==========================================
           MEDIA QUERY PARA TELÉFONOS (MÓVILES)
           ========================================== */
        @media (max-width: 600px) {
            .container {
                padding: 15px 12px;
            }

            .city-title {
                font-size: 24px;
                line-height: 1.2;
            }

            .category-subtitle {
                font-size: 14px;
                margin-bottom: 15px;
            }

            .city-banner-img {
                max-height: 180px;
            }

            .links-list {
                font-size: 14px;
            }

            .links-list li {
                margin-bottom: 14px;
                padding-bottom: 14px;
            }

            .links-list a {
                display: inline-block;
                padding: 2px 0;
            }

            .link-desc {
                font-size: 12px;
                line-height: 1.4;
            }

            .link-status-badge {
                margin-top: 4px;
                display: inline-block;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Navegación superior estilo retro -->
        <div class="header-nav">
            <a href="index.html">&laquo; Volver a 24col</a>
        </div>

        <!-- Título dinámico de la ciudad y categoría -->
        <div class="city-title" id="cityName">Ciudad</div>
        <div class="category-subtitle" id="categoryName">Categoría seleccionada</div>

        <!-- Espacio reservado para la imagen representativa de la ciudad y su crédito -->
        <figure class="city-banner-wrapper" id="cityBannerWrapper">
            <div class="city-banner-container">
                <img id="cityBanner" src="" alt="Imagen de la ciudad" class="city-banner-img">
            </div>
            <figcaption class="image-credit" id="imageCredit">Foto: Crédito de la imagen</figcaption>
        </figure>

        <div class="links-list">
            <ul id="linksContainer">
                <!-- Se cargan dinámicamente con JS según los parámetros -->
            </ul>
        </div>

    </div>

    <!-- Pie de página sticky -->
    <footer>
        &copy; 2026 (24col) | versión 2.2 | RECHACE IMITACIONES | Por: jahp
    </footer>

    <script src="data.js"></script>
<script src="ciudad.js"></script>
<script src="script.js"></script>

</body>
</html>
